<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>Relink ER Xリンク集</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#08111d;--panel:#101b2b;--panel2:#15243a;--line:#263b5c;--text:#eef5ff;--muted:#8fa4c2;--accent:#6eb6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding-bottom:76px}
header{padding:calc(20px + env(safe-area-inset-top)) 16px 20px;background:linear-gradient(135deg,#17365f,#0f6d69)}
h1{margin:0 0 6px;font-size:24px}.sub{margin:0;color:#d9e8f7;font-size:13px}
.searchbar{position:sticky;top:0;z-index:10;padding:10px;background:#08111dee;backdrop-filter:blur(12px);border-bottom:1px solid #1d2b43}
input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #2d4569;background:#0f1a2a;color:white;font-size:16px}
main{padding:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px}
.section-title h2{margin:0;font-size:18px}.section-title span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.char{padding:15px 12px;border-radius:15px;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);font-weight:700;cursor:pointer;min-height:68px;display:flex;align-items:center}
.hidden{display:none}.back{border:0;background:#1a2b44;color:#ddecff;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card{display:block;margin-bottom:10px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);text-decoration:none}
.title{font-weight:700;color:#a9d2ff;margin-bottom:7px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#1f3858;color:#a8d1ff}
.meta{font-size:12px;color:var(--muted)}.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed #3e587c;border-radius:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px calc(10px + env(safe-area-inset-bottom));background:#0a1525f2;border-top:1px solid #243650;text-align:center;color:#8fa4c2;font-size:12px}
</style>
</head>
<body>
<header><h1>Relink ER Xリンク集</h1><p class="sub">キャラごとに有用なX投稿だけを整理</p></header>
<div class="searchbar"><input id="search" placeholder="キャラ名・タグ・タイトルで検索"></div>
<main>
<section id="listView">
<div class="section-title"><h2>キャラ一覧</h2><span id="count"></span></div>
<div class="grid" id="characterGrid"></div>
</section>
<section id="detailView" class="hidden">
<button class="back" id="back">← キャラ一覧へ</button>
<div class="section-title"><h2 id="detailTitle"></h2><span id="linkCount"></span></div>
<div id="links"></div>
</section>
</main>
<div class="bottom">Xリンク・短いタイトル・タグだけのシンプル構成</div>
<script>
const CHARACTERS = ["主人公（グラン／ジータ）", "カタリナ", "ラカム", "イオ", "ロゼッタ", "オイゲン", "フェリ", "ランスロット", "ヴェイン", "パーシヴァル", "ジークフリート", "バザラガ", "ゼタ", "シャルロッテ", "ガンダゴウザ", "カリオストロ", "ナルメア", "ヨダルラーハ", "イド", "シエテ", "ソーン", "サンダルフォン", "ベアトリクス", "ユーステス", "フラウ", "フェディエル", "ガランツァ", "マギラフリラ"];
let posts = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

async function load(){
  try{
    const r = await fetch("posts.json?v="+Date.now());
    posts = r.ok ? await r.json() : [];
  }catch{posts=[]}
  renderCharacters();
}
function renderCharacters(filter=""){
  $("#listView").classList.remove("hidden");
  $("#detailView").classList.add("hidden");
  const q=filter.toLowerCase();
  const chars=CHARACTERS.filter(c=>c.toLowerCase().includes(q)||posts.some(p=>p.character===c&&JSON.stringify(p).toLowerCase().includes(q)));
  $("#count").textContent=`${chars.length}キャラ`;
  $("#characterGrid").innerHTML=chars.map(c=>{
    const n=posts.filter(p=>p.character===c).length;
    return `<div class="char" data-char="${esc(c)}">${esc(c)}${n?`（${n}）`:""}</div>`;
  }).join("");
  document.querySelectorAll(".char").forEach(x=>x.onclick=()=>showCharacter(x.dataset.char));
}
function showCharacter(name){
  $("#listView").classList.add("hidden");
  $("#detailView").classList.remove("hidden");
  $("#detailTitle").textContent=name;
  const data=posts.filter(p=>p.character===name);
  $("#linkCount").textContent=`${data.length}件`;
  $("#links").innerHTML=data.length?data.map(p=>`
    <a class="card" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="title">${esc(p.title||"X投稿")}</div>
      <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="meta">${esc(p.added_at||"")}</div>
    </a>`).join(""):`<div class="empty">まだリンクがありません。</div>`;
}
$("#back").onclick=()=>renderCharacters($("#search").value);
$("#search").oninput=e=>renderCharacters(e.target.value);
load();
</script>
</body>
</html>
