<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Relink ER 情報図鑑</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ff;background:#080f1d}
*{box-sizing:border-box}body{margin:0;background:#080f1d}
header{padding:24px 16px 18px;background:linear-gradient(135deg,#18295a,#0f766e)}
h1{margin:0 0 7px;font-size:25px}.sub{margin:0;color:#dbeafe;font-size:13px;line-height:1.6}
.controls{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:11px;background:#080f1dee;backdrop-filter:blur(10px)}
input,select{min-width:0;padding:12px;border:1px solid #334155;border-radius:12px;background:#111827;color:#fff;font-size:16px}
input{flex:1}main{padding:10px 12px 45px}.category{margin:12px 0;border:1px solid #25334d;border-radius:15px;background:#101827;overflow:hidden}
.category>h2{margin:0;padding:14px;font-size:19px}.category small{color:#94a3b8}
.topic{border-top:1px solid #25334d;padding:0 12px}.topic summary{padding:13px 0;font-weight:700;cursor:pointer}
.post{display:block;margin:0 0 10px;padding:12px;border-radius:12px;background:#172033;color:#e5e7eb;text-decoration:none}
.post b{display:block;color:#93c5fd;margin-bottom:5px}.post span{font-size:14px;line-height:1.55}.meta{margin-top:8px;font-size:12px;color:#94a3b8}
.empty,.notice{padding:25px 16px;text-align:center;color:#94a3b8}.notice{margin:12px;border:1px dashed #475569;border-radius:14px}
footer{padding:20px;text-align:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>
<h1>Relink ER 情報図鑑</h1>
<p class="sub" id="status">情報を読み込んでいます…</p>
</header>
<div class="controls">
<input id="q" placeholder="サンダルフォン、ダメージ上限…">
<select id="cat"><option value="">すべて</option></select>
</div>
<main id="tree"></main>
<footer>投稿内容の正確性はリンク先で確認してください。</footer>
<script>
let posts=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function readJson(path,fallback){
  try{const r=await fetch(path+'?v='+Date.now());if(!r.ok)throw new Error();return await r.json()}catch{return fallback}
}
async function init(){
  posts=await readJson('posts.json',[]);
  const s=await readJson('status.json',null);
  document.querySelector('#status').textContent=s
   ? `保存 ${s.total||0}件・今回追加 ${s.added||0}件・最終実行 ${new Date(s.last_run).toLocaleString('ja-JP')}`
   : 'まだ自動収集が実行されていません';
  [...new Set(posts.map(x=>x.category).filter(Boolean))].forEach(x=>{
    cat.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`)
  });
  render();
}
function render(){
  const word=q.value.toLowerCase().trim(), c=cat.value;
  const filtered=posts.filter(p=>(!c||p.category===c)&&(!word||JSON.stringify(p).toLowerCase().includes(word)));
  const grouped={};
  filtered.forEach(p=>(((grouped[p.category||'その他']??={})[p.topic||'未分類']??=[]).push(p)));
  tree.innerHTML=Object.entries(grouped).map(([category,topics])=>
    `<section class="category"><h2>${esc(category)} <small>${Object.values(topics).flat().length}件</small></h2>`+
    Object.entries(topics).map(([topic,arr])=>
      `<details class="topic" open><summary>└ ${esc(topic)}（${arr.length}）</summary>`+
      arr.map(p=>`<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener">
      <b>${esc(p.title||p.topic)}</b><span>${esc(p.summary||'')}</span>
      <div class="meta">検索: ${esc(p.source_search||'')}</div></a>`).join('')+
      `</details>`).join('')+`</section>`
  ).join('') || `<div class="notice">まだ情報がありません。GitHubのActionsから最初の収集を実行すると、ここに表示されます。</div>`;
}
q.oninput=render;cat.onchange=render;init();
</script>
</body>
</html>
