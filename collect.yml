name: 6時間ごとに収集

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: X公開RSSを確認して分類
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ROOT = Path(".")
          POSTS = ROOT / "posts.json"
          STATUS = ROOT / "status.json"

          SEARCHES = [
              ("グラブルリリンク", "#グラブルリリンク"),
              ("Relink", "#Relink"),
              ("Endless Ragnarok", '"Endless Ragnarok" OR エンドレスラグナロク'),
              ("サンダルフォン", "サンダルフォン Relink"),
              ("フェディエル", "フェディエル Relink"),
              ("ランスロット", "ランスロット Relink"),
              ("ジーン", "Relink ジーン"),
              ("ダメージ上限", "Relink ダメージ上限"),
              ("攻略", "Relink 攻略 OR CHAOS++ OR インフェルノ OR 極沌空所"),
          ]

          RSS_TEMPLATES = [
              "https://nitter.net/search/rss?f=tweets&q={query}",
          ]

          CHARACTERS = {
              "サンダルフォン":["サンダルフォン","sandalphon"],
              "フェディエル":["フェディエル","fediel"],
              "ランスロット":["ランスロット","lancelot"],
              "カリオストロ":["カリオストロ","cagliostro"],
              "オイゲン":["オイゲン","eugen"],
              "フラウ":["フラウ","fraux"],
          }
          GENES = {
              "ダメージ上限":["ダメージ上限","damage cap"],
              "追撃":["追撃","supplementary"],
              "戦気":["戦気"],
              "クリティカル":["クリティカル","critical"],
              "ジーン全般":["ジーン","sigil"],
          }
          GUIDES = {
              "CHAOS++":["chaos++"],
              "ルシファー":["ルシファー","lucilius"],
              "インフェルノ":["インフェルノ","inferno"],
              "極沌空所":["極沌空所"],
              "素材・周回":["素材","周回","ドロップ","効率"],
          }

          def strip_tags(s):
              return re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",s or ""))).strip()

          def classify(text):
              low=text.lower()
              for topic,keys in CHARACTERS.items():
                  if any(k.lower() in low for k in keys): return "キャラ",topic
              for topic,keys in GENES.items():
                  if any(k.lower() in low for k in keys): return "ジーン",topic
              for topic,keys in GUIDES.items():
                  if any(k.lower() in low for k in keys): return "攻略",topic
              if any(k in low for k in ["アップデート","update","ver.","patch"]): return "アップデート","更新情報"
              if any(k in low for k in ["バグ","不具合","bug"]): return "不具合","不具合・検証"
              return "その他","未分類"

          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 RelinkArchive/1.0"})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.read()

          def parse_feed(raw, search_name):
              root=ET.fromstring(raw); out=[]
              for item in root.findall(".//item"):
                  title=strip_tags(item.findtext("title",""))
                  desc=strip_tags(item.findtext("description",""))
                  link=(item.findtext("link","") or "").strip()
                  pub=item.findtext("pubDate","")
                  text=(title+" "+desc).strip()
                  if not link or not text: continue
                  category,topic=classify(text)
                  out.append({
                      "id":hashlib.sha256(link.encode()).hexdigest()[:20],
                      "title":title[:180],
                      "summary":text[:260],
                      "url":link.replace("nitter.net/","x.com/"),
                      "category":category,
                      "topic":topic,
                      "source_search":search_name,
                      "published_at":pub,
                      "collected_at":datetime.now(timezone.utc).isoformat(),
                  })
              return out

          old=[]
          if POSTS.exists():
              try: old=json.loads(POSTS.read_text(encoding="utf-8"))
              except Exception: old=[]
          by_id={x["id"]:x for x in old if isinstance(x,dict) and "id" in x}
          errors=[]; added=0

          for search_name, query in SEARCHES:
              encoded=urllib.parse.quote(query)
              succeeded=False
              for template in RSS_TEMPLATES:
                  try:
                      for post in parse_feed(fetch(template.format(query=encoded)),search_name):
                          if post["id"] not in by_id: added += 1
                          by_id[post["id"]] = post
                      succeeded=True
                      break
                  except Exception as e:
                      errors.append(f"{search_name}: {type(e).__name__}")
              if not succeeded:
                  print("取得失敗:",search_name)

          data=sorted(by_id.values(),key=lambda x:x.get("collected_at",""),reverse=True)[:1000]
          POSTS.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          status={
              "last_run":datetime.now(timezone.utc).isoformat(),
              "added":added,
              "total":len(data),
              "errors":errors,
          }
          STATUS.write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding="utf-8")
          print(status)
          PY

      - name: 結果を保存
        run: |
          git config user.name "relink-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts.json status.json
          git diff --cached --quiet || git commit -m "情報を自動更新"
          git push
