name: Relink ER 情報収集 修正版

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relink-er-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: X公開情報を検索・分類
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          POSTS = Path("posts.json")
          STATUS = Path("status.json")

          CHARACTERS = {
              "主人公（グラン／ジータ）": ["グラン", "ジータ", "Gran", "Djeeta"],
              "カタリナ": ["カタリナ", "Katalina"],
              "ラカム": ["ラカム", "Rackam"],
              "イオ": ["イオ", "Io"],
              "ロゼッタ": ["ロゼッタ", "Rosetta"],
              "オイゲン": ["オイゲン", "Eugen"],
              "フェリ": ["フェリ", "Ferry"],
              "ランスロット": ["ランスロット", "Lancelot"],
              "ヴェイン": ["ヴェイン", "Vane"],
              "パーシヴァル": ["パーシヴァル", "Percival"],
              "ジークフリート": ["ジークフリート", "Siegfried"],
              "バザラガ": ["バザラガ", "Vaseraga"],
              "ゼタ": ["ゼタ", "Zeta"],
              "シャルロッテ": ["シャルロッテ", "Charlotta"],
              "ガンダゴウザ": ["ガンダゴウザ", "Ghandagoza"],
              "カリオストロ": ["カリオストロ", "Cagliostro"],
              "ナルメア": ["ナルメア", "Narmaya"],
              "ヨダルラーハ": ["ヨダルラーハ", "Yodarha"],
              "イド": ["イド", "Id Relink"],
              "シエテ": ["シエテ", "Seofon"],
              "ソーン": ["ソーン", "Tweyen"],
              "サンダルフォン": ["サンダルフォン", "Sandalphon"],
              "ベアトリクス": ["ベアトリクス", "Beatrix"],
              "ユーステス": ["ユーステス", "Eustace"],
              "フラウ": ["フラウ", "Fraux"],
              "フェディエル": ["フェディエル", "Fediel"],
              "ガランツァ": ["ガランツァ", "Gallanza"],
              "マギラフリラ": ["マギラフリラ", "Maglielle", "Magielle"],
          }

          GENE_TOPICS = {
              "ダメージ上限": ["ダメージ上限", "ダメ上限", "damage cap", "通常攻撃上限", "アビリティ上限", "奥義上限"],
              "追撃": ["追撃", "supplementary damage"],
              "戦気": ["戦気"],
              "クリティカル": ["クリティカル", "critical"],
              "有利属性変換": ["有利属性変換", "war elemental"],
              "コンボボーナス": ["コンボボーナス", "combo booster"],
              "暴君": ["暴君", "tyranny"],
              "渾身": ["渾身", "stamina"],
              "修羅": ["修羅"],
              "スタン": ["スタン", "stun power"],
              "回避性能": ["回避性能", "improved dodge"],
              "ポーション所持数": ["ポーション所持数", "potion hoarder"],
              "ガッツ・自己復活": ["ガッツ", "自己復活", "guts", "autorevive"],
              "ジーン全般": ["ジーン", "sigil"],
          }

          GUIDE_TOPICS = {
              "CHAOS++": ["chaos++", "カオス++"],
              "ルシファー": ["ルシファー", "lucilius"],
              "ベルゼバブ": ["ベルゼバブ", "beelzebub"],
              "プロトバハムート": ["プロトバハムート", "proto bahamut"],
              "ザ・ワールド": ["ザ・ワールド", "the world"],
              "インフェルノ": ["インフェルノ", "inferno"],
              "極沌空所": ["極沌空所"],
              "オムニス・ゼーガリス": ["オムニス", "ゼーガリス"],
              "素材・周回": ["素材", "周回", "ドロップ", "効率", "入手方法", "稼ぎ"],
              "CPU・放置編成": ["cpu", "放置", "フルアシスト", "オート周回"],
              "DPS・木人検証": ["dps", "木人", "トライアル", "ダメージ検証"],
              "武器・超越強化": ["武器", "超越", "究極武器", "覚醒武器"],
              "マスタースキル": ["マスタースキル", "master skill", "master trait"],
              "召喚石": ["召喚石", "summon"],
          }

          SEARCHES = [
              ("総合：グラブルリリンク", "#グラブルリリンク"),
              ("総合：Relink", "#Relink"),
              ("総合：Endless Ragnarok", '"Endless Ragnarok"'),
              ("総合：ER日本語", "エンドレスラグナロク"),
              ("主要キャラ", "(サンダルフォン OR フェディエル OR ランスロット) Relink"),
              ("追加キャラ", "(ベアトリクス OR ユーステス OR フラウ OR ガランツァ OR マギラフリラ) Relink"),
              ("ジーン", "(ジーン OR sigil OR 戦気 OR 追撃) Relink"),
              ("ダメージ上限", '("ダメージ上限" OR "damage cap") Relink'),
              ("高難度攻略", "(CHAOS++ OR ルシファー OR Lucilius OR インフェルノ OR 極沌空所) Relink"),
              ("装備・DPS", "(装備 OR build OR DPS OR 木人 OR マスタースキル) Relink"),
              ("CPU・放置", "(CPU OR 放置 OR フルアシスト) Relink"),
              ("素材・周回", "(素材 OR 周回 OR ドロップ OR 入手方法) Relink"),
          ]

          NITTER_INSTANCES = [
              "https://xcancel.com",
              "https://nitter.poast.org",
              "https://nitter.privacyredirect.com",
              "https://nitter.tiekoetter.com",
              "https://nitter.space",
          ]

          def clean_text(value: str) -> str:
              value = re.sub(r"<[^>]+>", " ", value or "")
              value = html.unescape(value)
              return re.sub(r"\s+", " ", value).strip()

          def key_matches(text: str, key: str) -> bool:
              if any(ord(ch) > 127 for ch in key):
                  return key.casefold() in text.casefold()
              return re.search(rf"(?<![A-Za-z0-9]){re.escape(key)}(?![A-Za-z0-9])", text, flags=re.IGNORECASE) is not None

          def contains_any(text: str, words: list[str]) -> bool:
              return any(key_matches(text, word) for word in words)

          def classify(text: str):
              tags = []
              for character, keys in CHARACTERS.items():
                  if contains_any(text, keys):
                      tags.append(character)
              for topic, keys in GENE_TOPICS.items():
                  if contains_any(text, keys):
                      tags.append(topic)
              for topic, keys in GUIDE_TOPICS.items():
                  if contains_any(text, keys):
                      tags.append(topic)

              for character, keys in CHARACTERS.items():
                  if contains_any(text, keys):
                      return "1. キャラ", character, tags
              for topic, keys in GENE_TOPICS.items():
                  if contains_any(text, keys):
                      return "2. ジーン情報", topic, tags
              for topic, keys in GUIDE_TOPICS.items():
                  if contains_any(text, keys):
                      return "3. 攻略に有用な情報", topic, tags
              if contains_any(text, ["アップデート", "update", "patch", "ver."]):
                  return "4. アップデート", "更新情報", tags
              if contains_any(text, ["バグ", "不具合", "bug", "検証"]):
                  return "5. 不具合・検証", "不具合・検証", tags
              return "6. その他", "未分類", tags

          def fetch(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1",
                      "Accept": "application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.5",
                      "Accept-Language": "ja,en-US;q=0.8,en;q=0.6",
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  raw = response.read()
              head = raw[:5000].lower()
              if b"<rss" not in head and b"<feed" not in head:
                  raise ValueError("RSSではない応答")
              return raw

          def normalize_x_url(link: str):
              link = html.unescape(link).strip()
              parsed = urllib.parse.urlparse(link)
              if parsed.netloc.lower() in {"x.com", "www.x.com", "twitter.com", "www.twitter.com"}:
                  x_url = f"https://x.com{parsed.path}"
              elif "/status/" in parsed.path:
                  x_url = f"https://x.com{parsed.path}"
              else:
                  return None
              match = re.search(r"/([^/]+)/status/(\d+)", x_url)
              if not match:
                  return None
              return f"https://x.com/{match.group(1)}/status/{match.group(2)}"

          def parse_feed(raw: bytes, search_name: str, source: str):
              root = ET.fromstring(raw)
              results = []
              for item in root.findall(".//item"):
                  title = clean_text(item.findtext("title", ""))
                  description = clean_text(item.findtext("description", ""))
                  link = (item.findtext("link", "") or "").strip()
                  published = item.findtext("pubDate", "")
                  text = f"{title} {description}".strip()
                  x_link = normalize_x_url(link)
                  if not x_link or not text:
                      continue
                  category, topic, tags = classify(text)
                  status_match = re.search(r"/status/(\d+)", x_link)
                  stable_id = status_match.group(1) if status_match else x_link
                  results.append({
                      "id": hashlib.sha256(stable_id.encode("utf-8")).hexdigest()[:24],
                      "title": title[:180] or topic,
                      "summary": text[:350],
                      "url": x_link,
                      "category": category,
                      "topic": topic,
                      "tags": list(dict.fromkeys(tags)),
                      "source_search": search_name,
                      "source": source,
                      "published_at": published,
                      "collected_at": datetime.now(timezone.utc).isoformat(),
                  })
              return results

          def nitter_urls(query: str):
              encoded = urllib.parse.quote(query)
              for base in NITTER_INSTANCES:
                  yield f"{base}/search/rss?f=tweets&q={encoded}", base

          def bing_url(query: str) -> str:
              params = urllib.parse.urlencode({
                  "q": f"site:x.com/status {query}",
                  "format": "rss",
                  "setlang": "ja-jp",
                  "cc": "jp",
              })
              return f"https://www.bing.com/search?{params}"

          old_posts = []
          if POSTS.exists():
              try:
                  old_posts = json.loads(POSTS.read_text(encoding="utf-8"))
              except Exception:
                  old_posts = []

          by_id = {
              post["id"]: post
              for post in old_posts
              if isinstance(post, dict) and post.get("id")
          }

          added = 0
          errors = []
          successful_searches = 0
          source_counts = {}

          for index, (search_name, query) in enumerate(SEARCHES, 1):
              found = []
              used_source = None
              attempt_errors = []

              for url, source in nitter_urls(query):
                  try:
                      found = parse_feed(fetch(url), search_name, source)
                      used_source = source
                      if found:
                          break
                  except Exception as error:
                      attempt_errors.append(f"{source}: {type(error).__name__}")

              if not found:
                  try:
                      used_source = "Bing RSS（X検索補助）"
                      found = parse_feed(fetch(bing_url(query)), search_name, used_source)
                  except Exception as error:
                      attempt_errors.append(f"Bing RSS: {type(error).__name__}")

              if found:
                  successful_searches += 1
                  source_counts[used_source] = source_counts.get(used_source, 0) + 1
                  for post in found:
                      if post["id"] not in by_id:
                          added += 1
                      by_id[post["id"]] = post
                  result_text = f"{len(found)}件 / {used_source}"
              else:
                  errors.append({"search": search_name, "details": attempt_errors})
                  result_text = "0件"

              print(f"[{index}/{len(SEARCHES)}] {search_name}: {result_text}")
              time.sleep(1)

          posts = sorted(by_id.values(), key=lambda post: post.get("collected_at", ""), reverse=True)[:3000]
          POSTS.write_text(json.dumps(posts, ensure_ascii=False, indent=2), encoding="utf-8")

          status = {
              "last_run": datetime.now(timezone.utc).isoformat(),
              "added": added,
              "total": len(posts),
              "search_count": len(SEARCHES),
              "successful_searches": successful_searches,
              "character_count": len(CHARACTERS),
              "sources": source_counts,
              "errors": errors,
              "note": "カード不要版のため、取得漏れ・遅延・一時停止が発生する可能性があります。",
          }
          STATUS.write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: 収集結果をGitHubへ保存
        shell: bash
        run: |
          git config user.name "relink-er-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts.json status.json
          git diff --cached --quiet || git commit -m "ER情報を自動更新"
          git push
