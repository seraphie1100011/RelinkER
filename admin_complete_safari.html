<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>Relink ER 管理画面</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --bg:#08111d;--panel:#101b2b;--panel2:#14243a;--line:#29415f;
  --text:#eef5ff;--muted:#93a7c1;--accent:#68b5ff;--danger:#ff7b86;
  --ok:#59d69e;--warn:#ffd36e
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{
  padding:calc(18px + env(safe-area-inset-top)) 16px 18px;
  background:linear-gradient(135deg,#183963,#0f6b66)
}
h1{margin:0 0 5px;font-size:24px}
header p{margin:0;color:#d6e8f6;font-size:13px;line-height:1.5}
main{max-width:760px;margin:auto;padding:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.panel h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
label:first-child{margin-top:0}
input,select{
  width:100%;min-height:46px;padding:11px 12px;border-radius:12px;
  border:1px solid #365270;background:#0a1625;color:#fff;font-size:16px
}
input:focus,select:focus{outline:2px solid #68b5ff66;border-color:var(--accent)}
.help{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  min-height:38px;border:1px solid #395676;border-radius:999px;
  background:#14253b;color:#d8eaff;padding:8px 12px;font-size:13px
}
.tag.selected{background:#285d91;border-color:#70bbff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
button{font:inherit}
.btn{
  min-height:46px;border-radius:12px;padding:11px 12px;font-weight:700
}
.primary{border:0;background:var(--accent);color:#06121e}
.secondary{border:1px solid #3a5674;background:#15263b;color:#e3efff}
.danger{border:1px solid #8a4149;background:#401f27;color:#ffd9dd}
.status{display:none;margin-top:10px;padding:11px;border-radius:11px;font-size:13px;line-height:1.5}
.status.show{display:block}
.status.ok{background:#123c31;border:1px solid #2f775f;color:#c9f5e2}
.status.warn{background:#4a3915;border:1px solid #816522;color:#ffe7a6}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar .btn{min-height:40px;padding:8px 10px;font-size:13px}
.counter{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.item{background:var(--panel2);border:1px solid #2b4465;border-radius:14px;padding:12px;margin-top:10px}
.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h3{margin:0;font-size:15px;color:#add5ff}
.item a{color:#8fc9ff;word-break:break-all;font-size:12px}
.chip{display:inline-block;margin:7px 5px 0 0;padding:4px 8px;border-radius:999px;background:#213c5d;color:#acd4ff;font-size:11px}
.itembuttons{display:flex;gap:7px;margin-top:11px}
.itembuttons button{min-height:38px;padding:7px 11px;border-radius:10px;font-size:13px;font-weight:700}
.empty{text-align:center;padding:22px 12px;color:var(--muted);border:1px dashed #436184;border-radius:13px}
.filelabel{
  display:block;border:1px solid #3a5674;border-radius:12px;background:#15263b;
  padding:12px;text-align:center;font-weight:700;color:#e3efff
}
.filelabel input{display:none}
.small{font-size:12px;color:var(--muted);line-height:1.6}
code{color:#b9d8ff}
@media(max-width:420px){
  .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>Relink ER 管理画面</h1>
  <p>Xリンクを登録・編集し、完成したposts.jsonを出力します。</p>
</header>

<main>
  <section class="panel">
    <h2 id="formHeading">新しいリンクを追加</h2>

    <label for="url">Xの投稿URL</label>
    <input id="url" inputmode="url" autocapitalize="none" autocomplete="off"
      placeholder="https://x.com/ユーザー名/status/数字">

    <label for="character">キャラ</label>
    <select id="character"></select>

    <label for="title">短いタイトル</label>
    <input id="title" maxlength="80" placeholder="例：回避型ビルド">

    <label>タグ</label>
    <div id="tagButtons" class="tags"></div>
    <div class="help">複数選択できます。タグなしでも登録できます。</div>

    <div class="actions">
      <button id="resetButton" class="btn secondary" type="button">入力をクリア</button>
      <button id="saveButton" class="btn primary" type="button">追加する</button>
    </div>
    <div id="formStatus" class="status"></div>
  </section>

  <section class="panel">
    <h2>登録済みリンク</h2>
    <div class="toolbar">
      <button id="exportButton" class="btn primary" type="button">posts.jsonを書き出す</button>
      <button id="copyButton" class="btn secondary" type="button">JSONをコピー</button>
      <button id="clearAllButton" class="btn danger" type="button">全件削除</button>
      <span id="counter" class="counter">0件</span>
    </div>

    <label class="filelabel">
      既存のposts.jsonを読み込む
      <input id="importFile" type="file" accept=".json,application/json">
    </label>

    <label for="search">一覧を検索</label>
    <input id="search" placeholder="キャラ名・タイトル・タグ">

    <div id="list"></div>
    <div id="listStatus" class="status"></div>
  </section>

  <section class="panel">
    <h2>使い方</h2>
    <div class="small">
      1. 管理画面でリンクを追加します。<br>
      2. <b>posts.jsonを書き出す</b>を押します。<br>
      3. GitHubにある古い<code>posts.json</code>を削除し、出力した新しいファイルをアップロードします。<br>
      4. GitHub Pagesへ自動反映されます。
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var CHARACTERS = [
    "主人公（グラン／ジータ）","カタリナ","ラカム","イオ","ロゼッタ","オイゲン","フェリ",
    "ランスロット","ヴェイン","パーシヴァル","ジークフリート","バザラガ","ゼタ","シャルロッテ",
    "ガンダゴウザ","カリオストロ","ナルメア","ヨダルラーハ","イド","シエテ","ソーン",
    "サンダルフォン","ベアトリクス","ユーステス","フラウ","フェディエル","ガランツァ","マギラフリラ"
  ];

  var TAGS = ["火力","回避","CPU","DPS","装備","ジーン","マスタースキル","立ち回り","放置","小ネタ"];
  var STORAGE_KEY = "relink_er_admin_posts_v2";

  var posts = [];
  var selectedTags = [];
  var editingIndex = -1;

  function byId(id) { return document.getElementById(id); }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }

  function today() {
    var d = new Date();
    var month = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + month + "-" + day;
  }

  function normalizeUrl(value) {
    var url = String(value || "").trim();
    url = url.replace(/^https:\/\/twitter\.com\//i, "https://x.com/");
    url = url.split("?")[0].replace(/\/$/, "");
    return url;
  }

  function isValidXUrl(value) {
    return /^https:\/\/(www\.)?(x\.com|twitter\.com)\/[^\/]+\/status\/\d+/i.test(String(value || "").trim());
  }

  function showStatus(element, message, type) {
    element.textContent = message;
    element.className = "status show " + type;
  }

  function hideStatus(element) {
    element.className = "status";
    element.textContent = "";
  }

  function saveLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    } catch (error) {
      showStatus(byId("listStatus"), "このブラウザへ一時保存できませんでした。JSONを書き出して保管してください。", "warn");
    }
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (Array.isArray(data)) posts = data;
      }
    } catch (error) {
      posts = [];
    }
  }

  function makeCharacterOptions() {
    var select = byId("character");
    select.innerHTML = '<option value="">選択してください</option>';
    CHARACTERS.forEach(function (name) {
      var option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
  }

  function makeTagButtons() {
    var root = byId("tagButtons");
    root.innerHTML = "";
    TAGS.forEach(function (tag) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "tag";
      button.textContent = tag;
      button.setAttribute("data-tag", tag);
      button.addEventListener("click", function () {
        var index = selectedTags.indexOf(tag);
        if (index === -1) {
          selectedTags.push(tag);
          button.classList.add("selected");
        } else {
          selectedTags.splice(index, 1);
          button.classList.remove("selected");
        }
      });
      root.appendChild(button);
    });
  }

  function syncTagButtons() {
    var buttons = byId("tagButtons").querySelectorAll(".tag");
    Array.prototype.forEach.call(buttons, function (button) {
      var tag = button.getAttribute("data-tag");
      button.classList.toggle("selected", selectedTags.indexOf(tag) !== -1);
    });
  }

  function resetForm() {
    editingIndex = -1;
    selectedTags = [];
    byId("url").value = "";
    byId("character").value = "";
    byId("title").value = "";
    byId("formHeading").textContent = "新しいリンクを追加";
    byId("saveButton").textContent = "追加する";
    syncTagButtons();
    hideStatus(byId("formStatus"));
  }

  function validateForm() {
    var url = normalizeUrl(byId("url").value);
    var character = byId("character").value;
    var title = byId("title").value.trim();

    if (!isValidXUrl(url)) return "Xの投稿URLを正しく入力してください。";
    if (!character) return "キャラを選択してください。";
    if (!title) return "短いタイトルを入力してください。";

    var duplicateIndex = posts.findIndex(function (post, index) {
      return index !== editingIndex && normalizeUrl(post.url) === url;
    });
    if (duplicateIndex !== -1) return "このURLはすでに登録されています。";

    return "";
  }

  function currentEntry() {
    return {
      character: byId("character").value,
      title: byId("title").value.trim(),
      url: normalizeUrl(byId("url").value),
      tags: selectedTags.slice(),
      added_at: today(),
      source: "X"
    };
  }

  function saveEntry() {
    var error = validateForm();
    if (error) {
      showStatus(byId("formStatus"), error, "warn");
      return;
    }

    var entry = currentEntry();

    if (editingIndex >= 0) {
      entry.added_at = posts[editingIndex].added_at || today();
      posts[editingIndex] = entry;
      showStatus(byId("formStatus"), "変更を保存しました。", "ok");
    } else {
      posts.unshift(entry);
      showStatus(byId("formStatus"), "リンクを追加しました。", "ok");
    }

    saveLocal();
    renderList();
    window.setTimeout(resetForm, 700);
  }

  function editEntry(index) {
    var post = posts[index];
    editingIndex = index;
    byId("url").value = post.url || "";
    byId("character").value = post.character || "";
    byId("title").value = post.title || "";
    selectedTags = Array.isArray(post.tags) ? post.tags.slice() : [];
    byId("formHeading").textContent = "リンクを編集";
    byId("saveButton").textContent = "変更を保存";
    syncTagButtons();
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  function deleteEntry(index) {
    var post = posts[index];
    if (!window.confirm("「" + (post.title || "このリンク") + "」を削除しますか？")) return;
    posts.splice(index, 1);
    saveLocal();
    renderList();
    if (editingIndex === index) resetForm();
  }

  function renderList() {
    var root = byId("list");
    var query = byId("search").value.trim().toLowerCase();
    var visible = [];

    posts.forEach(function (post, index) {
      var haystack = JSON.stringify(post).toLowerCase();
      if (!query || haystack.indexOf(query) !== -1) {
        visible.push({post: post, index: index});
      }
    });

    byId("counter").textContent = posts.length + "件";

    if (!visible.length) {
      root.innerHTML = '<div class="empty">' +
        (posts.length ? "検索条件に合うリンクがありません。" : "まだリンクが登録されていません。") +
        "</div>";
      return;
    }

    root.innerHTML = visible.map(function (row) {
      var post = row.post;
      var chips = (Array.isArray(post.tags) ? post.tags : []).map(function (tag) {
        return '<span class="chip">' + escapeHtml(tag) + '</span>';
      }).join("");

      return '<article class="item">' +
        '<div class="itemtop"><div>' +
          '<h3>' + escapeHtml(post.title || "X投稿") + '</h3>' +
          '<div class="small">' + escapeHtml(post.character || "") + '</div>' +
        '</div><div class="small">' + escapeHtml(post.added_at || "") + '</div></div>' +
        '<div>' + chips + '</div>' +
        '<div style="margin-top:8px"><a href="' + escapeHtml(post.url || "#") + '" target="_blank" rel="noopener">' +
          escapeHtml(post.url || "") + '</a></div>' +
        '<div class="itembuttons">' +
          '<button type="button" class="secondary editButton" data-index="' + row.index + '">編集</button>' +
          '<button type="button" class="danger deleteButton" data-index="' + row.index + '">削除</button>' +
        '</div>' +
      '</article>';
    }).join("");

    Array.prototype.forEach.call(root.querySelectorAll(".editButton"), function (button) {
      button.addEventListener("click", function () {
        editEntry(Number(button.getAttribute("data-index")));
      });
    });

    Array.prototype.forEach.call(root.querySelectorAll(".deleteButton"), function (button) {
      button.addEventListener("click", function () {
        deleteEntry(Number(button.getAttribute("data-index")));
      });
    });
  }

  function exportJson() {
    var text = JSON.stringify(posts, null, 2);
    var blob = new Blob([text], {type: "application/json;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "posts.json";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showStatus(byId("listStatus"), "posts.jsonを書き出しました。iPhoneの「ファイル」アプリに保存してください。", "ok");
  }

  function fallbackCopy(text) {
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    var success = false;
    try { success = document.execCommand("copy"); } catch (error) { success = false; }
    document.body.removeChild(textarea);
    return success;
  }

  function copyJson() {
    var text = JSON.stringify(posts, null, 2);

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        showStatus(byId("listStatus"), "JSONをコピーしました。", "ok");
      }).catch(function () {
        if (fallbackCopy(text)) {
          showStatus(byId("listStatus"), "JSONをコピーしました。", "ok");
        } else {
          showStatus(byId("listStatus"), "コピーできませんでした。posts.jsonを書き出してください。", "warn");
        }
      });
    } else if (fallbackCopy(text)) {
      showStatus(byId("listStatus"), "JSONをコピーしました。", "ok");
    } else {
      showStatus(byId("listStatus"), "コピーできませんでした。posts.jsonを書き出してください。", "warn");
    }
  }

  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result || ""));
        if (!Array.isArray(data)) throw new Error("配列ではありません");

        var valid = data.filter(function (post) {
          return post && typeof post === "object" &&
            post.character && post.title && post.url;
        }).map(function (post) {
          return {
            character: String(post.character),
            title: String(post.title),
            url: normalizeUrl(post.url),
            tags: Array.isArray(post.tags) ? post.tags.map(String) : [],
            added_at: post.added_at ? String(post.added_at) : today(),
            source: post.source ? String(post.source) : "X"
          };
        });

        posts = valid;
        saveLocal();
        renderList();
        showStatus(byId("listStatus"), valid.length + "件を読み込みました。", "ok");
      } catch (error) {
        showStatus(byId("listStatus"), "読み込めませんでした。正しいposts.jsonを選んでください。", "warn");
      }
      byId("importFile").value = "";
    };
    reader.onerror = function () {
      showStatus(byId("listStatus"), "ファイルを読み込めませんでした。", "warn");
    };
    reader.readAsText(file);
  }

  function clearAll() {
    if (!posts.length) return;
    if (!window.confirm("登録済みリンクをすべて削除しますか？")) return;
    posts = [];
    saveLocal();
    resetForm();
    renderList();
    showStatus(byId("listStatus"), "すべて削除しました。", "ok");
  }

  function init() {
    makeCharacterOptions();
    makeTagButtons();
    loadLocal();
    renderList();

    byId("saveButton").addEventListener("click", saveEntry);
    byId("resetButton").addEventListener("click", resetForm);
    byId("exportButton").addEventListener("click", exportJson);
    byId("copyButton").addEventListener("click", copyJson);
    byId("clearAllButton").addEventListener("click", clearAll);
    byId("search").addEventListener("input", renderList);
    byId("importFile").addEventListener("change", function () {
      if (this.files && this.files[0]) importJson(this.files[0]);
    });
  }

  init();
}());
</script>
</body>
</html>
